<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEOYH 게임</title><link rel="icon" href="deepsea/icon.png"><style>
:root{--bg:#f6f9fc;--fg:#14202e;--muted:#5b6b7c;--card:#fff;--line:#dbe3ec;--accent:#0b6fb8}
@media (prefers-color-scheme:dark){:root{--bg:#0b1622;--fg:#e6edf5;--muted:#9fb0c2;--card:#122233;--line:#22374d;--accent:#5cb8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}a{color:var(--accent)}img{max-width:100%;height:auto}
h1{font-size:1.7rem;line-height:1.3}h2{font-size:1.2rem;margin-top:2em;padding-top:1em;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin:1em 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--card)}
li p{margin:.3em 0}.muted{font-size:.9rem;color:var(--muted)}
.hero{display:flex;gap:16px;align-items:center}.hero img{width:88px;height:88px;border-radius:20px}
.shots{display:flex;gap:10px;overflow-x:auto;padding:4px 0}.shots img{width:160px;border-radius:10px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.card img{width:64px;height:64px;border-radius:14px}
footer{margin-top:3em;padding-top:1em;border-top:1px solid var(--line)}
</style></head>
<body><main>
<h1>SEOYH 게임</h1><p class="muted">혼자 만드는 작은 모바일 게임들</p>

<footer class="muted">개발자: SEOYH · 문의: <a href="mailto:comanee808080@gmail.com">comanee808080@gmail.com</a></footer>
</main></body></html>
